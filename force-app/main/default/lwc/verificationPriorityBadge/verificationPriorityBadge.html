<template>
    <div class="slds-box slds-theme_default badge-container">
        <div class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread">
            <div class="slds-media slds-media_center">
                <div class="slds-media__figure">
                    <lightning-icon icon-name={priorityIcon} size="medium" variant={iconVariant}></lightning-icon>
                </div>
                <div class="slds-media__body">
                    <p class="slds-text-heading_small slds-m-bottom_none font-bold">
                        Verification Priority: <span class={priorityBadgeClass}>{priorityLevel} ({priorityScore}/100)</span>
                    </p>
                    <p class="slds-text-body_small slds-text-color_weak">
                        Administrative review index for municipal field officers
                    </p>
                </div>
            </div>
            <div>
                <lightning-button label="Audit Breakdown" variant="neutral" icon-name="utility:preview" onclick={handleOpenModal}>
                </lightning-button>
            </div>
        </div>

        <!-- Breakdown Modal -->
        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" onclick={handleCloseModal}>
                            <lightning-icon icon-name="utility:close" alternative-text="Close" size="small"></lightning-icon>
                        </button>
                        <h2 class="slds-text-heading_medium">Property Verification Priority Audit Trail</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div class="slds-notify slds-notify_alert slds-alert_info slds-m-bottom_medium" role="alert">
                            <h2>Note: This score is an administrative prioritization tool to optimize municipal inspection workloads. It does not represent proof of fraud or tax evasion.</h2>
                        </div>
                        <div class="slds-box slds-theme_shade">
                            <pre class="factors-text">{priorityReasons}</pre>
                        </div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="brand" label="Close" onclick={handleCloseModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </div>
</template>
